<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Share your product experience with this accessible product review form.">
    <meta name="author" content="Victor Adeshile">
    <title>Product Review | Victor Adeshile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/product-review.css">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/product-review.js" defer></script>
</head>
<body>
    <header class="page-header">
        <h1>Product Review</h1>
    </header>

    <main>
        <form class="review-form" action="review.html" method="get">
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset class="rating-fieldset">
                <legend>Overall Rating</legend>
                <div class="rating-options">
                    <div class="rating-choice">
                        <input id="rating-1" name="rating" type="radio" value="1" required>
                        <label for="rating-1"><span aria-hidden="true">☆</span><span class="visually-hidden">1 star</span></label>
                    </div>
                    <div class="rating-choice">
                        <input id="rating-2" name="rating" type="radio" value="2" required>
                        <label for="rating-2"><span aria-hidden="true">☆☆</span><span class="visually-hidden">2 stars</span></label>
                    </div>
                    <div class="rating-choice">
                        <input id="rating-3" name="rating" type="radio" value="3" required>
                        <label for="rating-3"><span aria-hidden="true">☆☆☆</span><span class="visually-hidden">3 stars</span></label>
                    </div>
                    <div class="rating-choice">
                        <input id="rating-4" name="rating" type="radio" value="4" required>
                        <label for="rating-4"><span aria-hidden="true">☆☆☆☆</span><span class="visually-hidden">4 stars</span></label>
                    </div>
                    <div class="rating-choice">
                        <input id="rating-5" name="rating" type="radio" value="5" required>
                        <label for="rating-5"><span aria-hidden="true">☆☆☆☆☆</span><span class="visually-hidden">5 stars</span></label>
                    </div>
                </div>
            </fieldset>

            <label for="installation-date">Date of Installation</label>
            <input id="installation-date" name="installationDate" type="date" required>

            <fieldset class="features-fieldset">
                <legend>Which features did you find useful in the product? <em>(Check all that apply)</em></legend>
                <div class="checkbox-list">
                    <label for="feature-durability">
                        <input id="feature-durability" name="features" type="checkbox" value="Durability">
                        Durability
                    </label>
                    <label for="feature-ease">
                        <input id="feature-ease" name="features" type="checkbox" value="Ease of Use">
                        Ease of Use
                    </label>
                    <label for="feature-performance">
                        <input id="feature-performance" name="features" type="checkbox" value="Performance">
                        Performance
                    </label>
                    <label for="feature-design">
                        <input id="feature-design" name="features" type="checkbox" value="Design">
                        Design
                    </label>
                </div>
            </fieldset>

            <label for="written-review">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="written-review" name="writtenReview" rows="5" maxlength="1500"></textarea>

            <label for="user-name">Your Name <span class="optional">(Optional)</span></label>
            <input id="user-name" name="userName" type="text" autocomplete="name">

            <input class="submit-button" type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 🎻 Victor Adeshile 🎻 Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
